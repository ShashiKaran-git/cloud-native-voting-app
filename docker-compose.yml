version: '3.8'

services:

  vote:
    build: ./vote
    ports:
      - "5050:80"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - voting-network

  worker:
    build: ./worker
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=votes
    depends_on:
      - redis
      - db
    networks:
      - voting-network

  result:
    build: ./result
    ports:
      - "5001:80"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=votes
    depends_on:
      - db
    networks:
      - voting-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - voting-network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=votes
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - voting-network

networks:
  voting-network:
    driver: bridge

volumes:
  postgres-data: